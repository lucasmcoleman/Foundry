services:
  foundry-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.12-slim
    # SECURITY: the container binds 0.0.0.0 internally (the container is the
    # boundary). Host publication defaults to loopback; set FOUNDRY_UI_BIND
    # to expose on a different interface. Auth fails closed until a key is set.
    # Running the pipeline grants shell-equivalent access.
    ports:
      - "${FOUNDRY_UI_BIND:-127.0.0.1}:${FOUNDRY_UI_PORT:-7865}:7865"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - FOUNDRY_API_KEY=${FOUNDRY_API_KEY:-}
      - FOUNDRY_REQUIRE_AUTH=1
      - FOUNDRY_UI_ORIGINS=${FOUNDRY_UI_ORIGINS:-}
      - FOUNDRY_CONFIG_PATH=/home/foundry/.foundry/config.json
      - FOUNDRY_WORK_DIR=/app
      - FOUNDRY_OUTPUT_DIR=/app/output
      - FOUNDRY_UI_PORT=7865
      - HSA_ENABLE_SDMA=0
      - PYTORCH_HIP_ALLOC_CONF=backend:native,expandable_segments:True
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    volumes:
      - model-output:/app/output
      - model-cache:/home/foundry/.cache/huggingface
      - foundry-settings:/home/foundry/.foundry
    restart: unless-stopped

  magicquant:
    build:
      context: ../MagicQuant
      dockerfile: docker/Dockerfile
    volumes:
      - model-output:/app/output
    profiles:
      - tools

volumes:
  model-output:
    driver: local
  model-cache:
    driver: local
  foundry-settings:
    driver: local
